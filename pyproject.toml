[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deliberative-irt-simulation"
version = "1.0.0"
description = "Evaluating Deliberative Settings & Persona Competence using Item Response Theory (IRT)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Deliberative Democracy Lab" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "sentence-transformers>=3.0.0"
]

[project.scripts]
deliberate-irt = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
pythonPlatform = "Darwin"
extraPaths = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
